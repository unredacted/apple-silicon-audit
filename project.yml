# XcodeGen spec. Regenerate with Scripts/gen-project.sh; the .xcodeproj is gitignored.
# Phase 2 scope: iOS app + embedded watchOS app for the M0 hardware spike.
# macOS/visionOS/tvOS destinations join the app target in Phases 4 and 8.
name: SiliconAudit
options:
  bundleIdPrefix: org.unredacted
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    INFOPLIST_KEY_CFBundleDisplayName: Silicon Audit
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  SiliconAuditPackage:
    path: .

targets:
  SiliconAudit:
    type: application
    platform: iOS
    sources:
      - path: Apps/SiliconAudit
      - path: Apps/Shared
    dependencies:
      - package: SiliconAuditPackage
        products: [SiliconAuditCore, SiliconAuditUI]
      - target: SiliconAuditWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.unredacted.siliconaudit
        PRODUCT_NAME: Silicon Audit
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  SiliconAuditWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/SiliconAuditWatch
      - path: Apps/Shared
    dependencies:
      - package: SiliconAuditPackage
        products: [SiliconAuditCore, SiliconAuditUI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.unredacted.siliconaudit.watchkitapp
        PRODUCT_NAME: Silicon Audit
        SKIP_INSTALL: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: org.unredacted.siliconaudit
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown

schemes:
  SiliconAudit:
    build:
      targets:
        SiliconAudit: all
    run:
      config: Debug
    archive:
      config: Release
  SiliconAuditWatch:
    build:
      targets:
        SiliconAuditWatch: all
    run:
      config: Debug
