name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  swift:
    name: Build and test (macOS 26, arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: CLI smoke
        run: swift run silicon-audit --version
      - name: Export fixtures and validate against the schema
        run: |
          swift run silicon-audit export --fixture docs/evidence/Mac17,7-25G83.txt > /tmp/mac.json
          swift run silicon-audit export --fixture docs/evidence/Mac17,7-25G83.txt --walk-refused > /tmp/mac-refused.json
          swift run silicon-audit export --compact --fixture docs/evidence/Mac17,7-25G83.txt | swift run silicon-audit import > /tmp/mac-compact.json
          Scripts/validate-export.sh /tmp/mac.json /tmp/mac-refused.json /tmp/mac-compact.json

  simulators:
    name: Build UI for tvOS, visionOS, watchOS simulators
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build SiliconAuditUI for each simulator SDK
        # The package's own schemes, no XcodeGen needed: this catches SwiftUI availability differences
        # (no glassEffect on tvOS/visionOS, no textSelection or size classes on tvOS, and so on).
        run: |
          for dest in "tvOS Simulator" "visionOS Simulator" "watchOS Simulator"; do
            echo "::group::$dest"
            xcodebuild build -scheme SiliconAuditUI -destination "generic/platform=$dest" CODE_SIGNING_ALLOWED=NO -quiet
            echo "::endgroup::"
          done
