name: Results database
on:
  pull_request:
    paths: ["results/**", "Schema/**", "Tools/generate-matrix/**", ".github/workflows/results.yml"]
  push:
    branches: [main]
    paths: ["results/**", "Schema/**", "Tools/generate-matrix/**"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    name: Validate contributed results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tools/generate-matrix/package-lock.json
      - run: npm ci
        working-directory: Tools/generate-matrix
      - name: Validate every result (schema, environment flags, path, conflicts)
        run: npm run check
        working-directory: Tools/generate-matrix

  regenerate:
    name: Regenerate matrix and site
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tools/generate-matrix/package-lock.json
      - run: npm ci
        working-directory: Tools/generate-matrix
      - run: npm run generate
        working-directory: Tools/generate-matrix
      - name: Commit regenerated MATRIX.md and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MATRIX.md site/index.html
          git diff --cached --quiet || git commit -m "Regenerate results matrix"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish site
    if: github.event_name == 'push'
    needs: regenerate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
